# =============================================================================
# 砚台考研打卡 · nginx 生产参考配置（性能优化 P2-4）
#
# 使用方式：按实际域名/证书路径/部署目录调整后，放入
#   /etc/nginx/sites-available/ 并软链到 sites-enabled/，nginx -t 验证后 reload。
#
# 缓存策略与 vite 构建产物对应：
#   /assets/*      带内容哈希指纹 → 一年 immutable 长缓存
#   /screenshots/* 介绍页截图（webp，无指纹）→ 7 天 public
#   /（index.html）SPA 入口 → no-cache，每次协商验证，保证发版即时生效
# =============================================================================

# HTTP → HTTPS 跳转
server {
    listen 80;
    listen [::]:80;
    server_name example.com;  # TODO: 替换为实际域名

    return 301 https://$host$request_uri;
}

server {
    # 443 + TLS + HTTP/2
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;  # TODO: 替换为实际域名

    # TODO: 替换为实际证书路径（如 certbot 签发的 letsencrypt 路径）
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # 前端构建产物目录（vite build 输出）
    root /var/www/kaoyandaily/client/dist;  # TODO: 替换为实际部署路径
    index index.html;

    # ---------- gzip 压缩 ----------
    # 仅压缩文本类资源；小于 1KB 的文件压缩收益低于开销，跳过
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;
    gzip_vary on;

    # ---------- 静态资源缓存 ----------
    # vite 指纹资源：内容变化则文件名变化，可放心一年 immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 介绍页截图（无指纹但更新频率低）：7 天 public
    location /screenshots/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- API 反向代理 ----------
    # 透传 Host 与真实客户端信息，配合服务端 app.set('trust proxy', 1)
    # 使 express-session secure cookie 与限流按真实 IP 正常工作
    location /api/ {
        # 允许 >1MB 的备份上传（与 Express 20mb limit 一致）
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- SPA 回退 ----------
    # index.html 不缓存（no-cache 每次协商），未命中的路径回退到入口
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
